name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore src/FixturesApi.csproj

      - name: Build
        run: dotnet build src/FixturesApi.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test src/FixturesApi.csproj --configuration Release --no-build --verbosity normal
